services:
  backend:
    build: ./backend
    container_name: backend-container
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - code-runner-net

  frontend:
    build: ./frontend
    container_name: frontend-container
    ports:
      - "3000:80"
    networks:
      - code-runner-net

networks:
  code-runner-net:
